<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Table</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center text-primary">
            Student Details

                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>101</td>
                        <td>Ravi</td>
                        <td>BCA</td>
                        <td>85</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Priya</td>
                        <td>B.Sc</td>
                        <td>90</td>
                    </tr>

                    <tr>
                        <td>103</td>
                        <td>Rahul</td>
                        <td>B.Tech</td>
                        <td>88</td>
                    </tr>

                    <tr>
                        <td>104</td>
                        <td>Sneha</td>
                        <td>BCA</td>
                        <td>92</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
