<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Cards</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center text-primary mb-4">
            Bootstrap Card Examples
        </h2>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h4 class="card-title">
                            HTML
                        </h4>

                        <p class="card-text">
                            HTML is used to create webpage structure.
                        </p>

                        <a href="#"
                           class="btn btn-primary">
                            Read More
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h4 class="card-title">
                            CSS
                        </h4>

                        <p class="card-text">
                            CSS is used to style webpages.
                        </p>

                        <a href="#"
                           class="btn btn-success">
                            Read More
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h4 class="card-title">
                            Bootstrap
                        </h4>

                        <p class="card-text">
                            Bootstrap is a frontend CSS framework.
                        </p>

                        <a href="#"
                           class="btn btn-danger">
                            Read More
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
